[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  # "vite" runs the Vite dev server as the framework subprocess.
  # Netlify Dev listens on port 8888 and proxies to Vite on port 5173.
  # framework = "#custom" tells Netlify Dev to bypass its own redirect
  # middleware for proxied requests so Vite paths like /@vite/client and
  # /src/main.jsx are served as JS modules instead of being rewritten to
  # /index.html by the SPA fallback rule below.
  command    = "vite"
  framework  = "#custom"
  targetPort = 5173
  port       = 8888
  publish    = "dist"
  autoLaunch = false

# SPA fallback — applies in production only (Netlify CDN).
# All routes without a matching file in dist/ serve index.html so
# React Router can handle client-side navigation.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
